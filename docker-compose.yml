services:
    firefox:
        container_name: firefox
        image: selenium/standalone-firefox:latest
        ports: ['4444:4444']
        healthcheck:
            test: >
                curl -sf http://localhost:4444/wd/hub/status | grep "Selenium Grid ready"
            start_period: 10s
            interval: 10s
            timeout: 3s
            retries: 100
    downloader:
        container_name: downloader
        build:
            context: .
        depends_on:
            firefox:
                condition: service_healthy
        volumes: ['./downloads:/app/downloads']
